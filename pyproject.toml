[project]
name = "local-airflow-poc"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.135.1", "starlette==1.7.0", "httpx==0.28.1", "pydantic==2.12.5", "uvicorn==0.41.0", "boto3==1.43.75", "boto3-stubs[s3]==1.43.75"]

[dependency-groups]
dev = ["mypy==1.19.1", "pytest==9.0.2", "ruff==0.15.6", "apache-airflow-task-sdk==1.3.2"]

[tool.pytest.ini_options]
pythonpath = ["services/run-api", "airflow-core"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["services/run-api", "airflow-core", "tools", "tests", "infra/airflow/bootstrap.py", "infra/egress/proxy.py", "projects/example-service/policy.py", "projects/example-service/workflow_policy.py", "projects/example-service/operational_policy.py", "projects/example-service/scripts/operational.py", "projects/example-service/scripts/workflow.py", "projects/example-service/scripts/checks.py", "projects/example-service/scripts/secret_scan.py"]
mypy_path = "airflow-core"
