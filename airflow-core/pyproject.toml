[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-airflow-artifacts"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["boto3==1.43.75", "boto3-stubs[s3]==1.43.75", "pydantic>=2.12.5,<3"]

[tool.setuptools.packages.find]
where = ["."]
